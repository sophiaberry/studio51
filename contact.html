<section class="contact" id="contact">
  <p class="script-bg" aria-hidden="true">let’s talk</p>
  <div class="left">
    <h2 class="strip">Contact</h2>
    <p class="lead">tell me what you're working on and when you need it</p>
    <span class="addr" id="addr">sophienberry@gmail.com</span>
    <button class="copy" id="copyBtn" type="button">copy email</button>
  </div>
  <form class="form" id="inquiry" action="https://formsubmit.co/sophienberry@gmail.com" method="POST">
      <p class="mono lead">or send a request</p>
      <div class="row2">
        <label>name<input name="name" autocomplete="name" required></label>
        <label>email<input name="email" type="email" autocomplete="email" required></label>
      </div>
      <label>what are you looking for?
        <select name="service" required>
          <option value="" disabled selected>choose one</option>
          <option>Website Design</option>
          <option>Podcast Production</option>
          <option>Project Management</option>
          <option>Marketing Strategy</option>
          <option>Content Creation</option>
          <option>Social Management</option>
          <option>A mix / not sure yet</option>
        </select>
      </label>
      <label>timeline
        <select name="timeline" required>
          <option value="" disabled selected>when do you need it?</option>
          <option>As soon as possible</option>
          <option>Within a month</option>
          <option>1–3 months</option>
          <option>3+ months</option>
          <option>Flexible</option>
        </select>
      </label>
      <label>tell me about the project<textarea name="message" required></textarea></label>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <input type="hidden" name="_subject" value="New STUDIO51 request">
      <input type="hidden" name="_template" value="table">
      <button type="submit">SEND</button>
      <p class="status" id="formStatus" role="status"></p>
    </form>
</section>
